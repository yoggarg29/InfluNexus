<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — InfluNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="role-influencer">
  <div class="role-strip"></div>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/infldash">
        <img src="pics/logo3.jpg" alt="InfluNexus logo" width="42" height="42" style="object-fit:cover;">
        <span class="navbar-brand-text">InfluNexus</span>
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="pt-5 pb-4">
      <div class="role-tag mb-2">Influencer space</div>
      <h1 class="mb-1">My Profile</h1>
      <p class="lede">This is what brands see when they search for you — keep it complete and current.</p>
    </div>

    <div class="card mb-5">
      <div class="card-body p-4 p-md-5">
        <div id="profileAlert"></div>
        <form id="profileForm" class="row g-3">
            <div class="col-md-8">
              <label for="txtemail" class="form-label">Email id</label>
              <input type="email" readonly class="form-control" id="txtemail">
            </div>
            <div class="col-md-4">
                <label class="form-label d-block">Profile Picture</label>
                <div class="d-flex align-items-center gap-3">
                  <img src="" class="avatar-ring" id="prev" alt="Preview" height="64" width="64">
                  <input type="file" name="profilePicture" id="prpic" accept="image/*" class="form-control form-control-sm">
                </div>
            </div>

            <div class="col-12"><hr class="my-2" style="border-color:var(--border);"></div>

            <div class="col-md-4">
              <label for="txtpname" class="form-label">Name</label>
              <input type="text" required class="form-control" placeholder="Enter Name" id="txtpname">
            </div>
            <div class="col-md-4">
              <label for="txtmno" class="form-label">Phone Number</label>
              <input type="text" required placeholder="Enter Phone Number" class="form-control" id="txtmno">
            </div>
            <div class="col-md-4">
              <label for="gender" class="form-label">Gender</label>
              <select required id="gender" class="form-select">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Others">Others</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="dob" class="form-label">Date Of Birth</label>
              <input required type="date" class="form-control" id="dob">
            </div>
            <div class="col-md-8">
              <label for="txtadr" class="form-label">Address</label>
              <input required type="text" class="form-control" id="txtadr" placeholder="Enter your address">
            </div>

            <div class="col-md-6">
              <label for="txtcity" class="form-label">City</label>
              <input required type="text" class="form-control" id="txtcity">
            </div>
            <div class="col-md-4">
              <label for="state" class="form-label">State</label>
              <select required id="state" class="form-select">
                <option value="punjab">Punjab</option>
                <option value="mumbai">Mumbai</option>
                <option value="delhi">Delhi</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="txtpcode" class="form-label">Pin Code</label>
              <input required type="text" class="form-control" id="txtpcode">
            </div>

            <div class="col-12"><hr class="my-2" style="border-color:var(--border);"></div>

            <div class="col-md-3">
                <label for="contype" class="form-label">Content Type</label>
                <select required size="6" multiple id="contype" class="form-select">
                  <option value="Fashion">Fashion</option>
                  <option value="Fitness">Fitness</option>
                  <option value="Health and Wellness">Health and Wellness</option>
                  <option value="Food & Nutrition">Food & Nutrition</option>
                  <option value="Travel">Travel</option>
                  <option value="Business & Finance">Business & Finance</option>
                  <option value="Family">Family</option>
                  <option value="Sports">Sports</option>
                  <option value="Gaming">Gaming</option>
                  <option value="Animal">Animal</option>
                  <option value="Beauty">Beauty</option>
                  <option value="Technology">Technology</option>
                  <option value="Coding">Coding</option>
                  <option value="Education">Education</option>
                  <option value="Photography">Photography</option>
                  <option value="Others">Others</option>
                </select>
                <div class="form-text">Hold Ctrl / Cmd to select more than one.</div>
            </div>
            <div class="col-md-9">
                <div class="row">
                  <div class="col-md-4">
                    <label for="txtinsta" class="form-label">Instagram Account</label>
                    <input required type="text" class="form-control" placeholder="Enter your Instagram username" id="txtinsta">
                  </div>
                  <div class="col-md-4">
                    <label for="txtutube" class="form-label">Youtube Channel</label>
                    <input required type="text" class="form-control" placeholder="Enter name of Youtube channel" id="txtutube">
                  </div>
                  <div class="col-md-4">
                    <label for="txtx" class="form-label">Twitter Account</label>
                    <input required type="text" class="form-control" placeholder="Enter your Twitter username" id="txtx">
                  </div>
                </div>
                <div class="col-md-12 mt-3">
                    <label for="txtothers" class="form-label">Other Details (if any)</label>
                    <textarea class="form-control" placeholder="Enter any other details" rows="3" id="txtothers"></textarea>
                </div>
            </div>
            <div class="col-12 pt-2">
              <button type="button" id="btnsubmit" class="btn btn-primary px-4">Save Profile</button>
            </div>
          </form>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="js/common.js"></script>
<script>
  let existingPicture = "";

  $(document).ready(function () {
    requireSession(function (user) {
      $("#txtemail").val(user.email);
      loadProfile();
    });

    $("#prpic").on("change", function () {
      const file = this.files[0];
      if (file) $("#prev").attr("src", URL.createObjectURL(file));
    });

    function loadProfile() {
      $.get("/api/influencer/profile").done(function (resp) {
        const p = resp.profile;
        if (!p) {
          $("#prev").attr("src", "uploads/nopic.svg");
          return;
        }
        $("#txtpname").val(p.full_name);
        $("#txtmno").val(p.phone);
        $("#gender").val(p.gender);
        $("#dob").val(p.dob);
        $("#txtadr").val(p.address);
        $("#txtcity").val(p.city);
        $("#state").val(p.state);
        $("#txtpcode").val(p.pincode);
        $("#contype").val(p.content_type ? p.content_type.split(",") : []);
        $("#txtinsta").val(p.instagram_handle);
        $("#txtutube").val(p.youtube_channel);
        $("#txtx").val(p.twitter_handle);
        $("#txtothers").val(p.other_details);
        $("#prev").attr("src", "uploads/" + p.profile_picture);
        existingPicture = p.profile_picture;
      });
    }

    $("#btnsubmit").click(function () {
      const formData = new FormData();
      formData.append("fullName", $("#txtpname").val());
      formData.append("phone", $("#txtmno").val());
      formData.append("gender", $("#gender").val());
      formData.append("dob", $("#dob").val());
      formData.append("address", $("#txtadr").val());
      formData.append("city", $("#txtcity").val());
      formData.append("state", $("#state").val());
      formData.append("pincode", $("#txtpcode").val());
      $("#contype").val().forEach(v => formData.append("contentType", v));
      formData.append("instagram", $("#txtinsta").val());
      formData.append("youtube", $("#txtutube").val());
      formData.append("twitter", $("#txtx").val());
      formData.append("otherDetails", $("#txtothers").val());
      formData.append("existingPicture", existingPicture);
      const file = $("#prpic")[0].files[0];
      if (file) formData.append("profilePicture", file);

      withButtonSpinner("#btnsubmit", "Saving...", function () {
        return $.ajax({
          type: "POST",
          url: "/api/influencer/profile",
          data: formData,
          processData: false,
          contentType: false,
        });
      }).done(function (resp) {
        showAlert("#profileAlert", resp.message, "success");
        existingPicture = resp.profilePicture;
      }).fail(function (xhr) {
        showAlert("#profileAlert", xhr.responseJSON ? xhr.responseJSON.message : "Could not save profile.", "danger");
      });
    });
  });
</script>
</body>
</html>
