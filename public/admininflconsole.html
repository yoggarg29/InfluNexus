<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Console — InfluNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="role-admin">
    <div class="role-strip"></div>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/admindash">
          <img src="pics/logo3.jpg" alt="InfluNexus logo" width="42" height="42" style="object-fit:cover;">
          <span class="navbar-brand-text">InfluNexus</span>
        </a>
      </div>
    </nav>

    <div class="container">
      <div class="pt-5 pb-4">
        <div class="role-tag mb-2">Admin console</div>
        <h1 class="mb-1">Influencer Console</h1>
        <p class="lede">Full profile details for every influencer on the platform.</p>
      </div>

      <div class="table-wrap mb-5" style="overflow-x:auto;">
          <table class="table table-hover mb-0">
              <thead>
              <tr>
                  <th>Sr. No.</th>
                  <th>Email id</th>
                  <th>Name</th>
                  <th>Picture</th>
                  <th>Contact No.</th>
                  <th>Gender</th>
                  <th>DOB</th>
                  <th>Address</th>
                  <th>City</th>
                  <th>State</th>
                  <th>Pin code</th>
                  <th>Content type</th>
                  <th>Instagram</th>
                  <th>Youtube</th>
                  <th>Twitter</th>
                  <th>Other Details</th>
              </tr>
              </thead>
              <tbody id="inflBody"></tbody>
          </table>
      </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="js/common.js"></script>
<script>
  $(document).ready(function () {
    $.get("/api/admin/influencers").done(function (rows) {
      const $body = $("#inflBody").empty();
      if (rows.length === 0) {
        $body.append('<tr><td colspan="16" class="text-center py-4 text-muted">No influencer profiles yet.</td></tr>');
        return;
      }
      rows.forEach(function (p, index) {
        $body.append(`
          <tr>
            <td>${index + 1}</td>
            <td>${p.email}</td>
            <td>${p.full_name}</td>
            <td><img src="uploads/${p.profile_picture}" class="avatar-ring" width="44" height="44" alt="${p.full_name}"></td>
            <td>${p.phone}</td>
            <td>${p.gender}</td>
            <td>${p.dob}</td>
            <td>${p.address}</td>
            <td>${p.city}</td>
            <td>${p.state}</td>
            <td>${p.pincode}</td>
            <td>${p.content_type}</td>
            <td>${p.instagram_handle || "-"}</td>
            <td>${p.youtube_channel || "-"}</td>
            <td>${p.twitter_handle || "-"}</td>
            <td>${p.other_details || "-"}</td>
          </tr>
        `);
      });
    });
  });
</script>
</body>
</html>
