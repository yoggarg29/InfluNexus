<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Manager — InfluNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="role-admin">
    <div class="role-strip"></div>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/admindash">
          <img src="pics/logo3.jpg" alt="InfluNexus logo" width="42" height="42" style="object-fit:cover;">
          <span class="navbar-brand-text">InfluNexus</span>
        </a>
      </div>
    </nav>

    <div class="container">
      <div class="pt-5 pb-4">
        <div class="role-tag mb-2">Admin console</div>
        <h1 class="mb-1">User Manager</h1>
        <p class="lede">Every account on the platform, in one place.</p>
      </div>

      <div id="usersAlert"></div>
      <div class="table-wrap mb-5">
          <table class="table table-hover mb-0">
              <thead>
              <tr>
                  <th>Sr. No.</th>
                  <th>Email Id</th>
                  <th>User Type</th>
                  <th>Status</th>
                  <th>Delete</th>
                  <th>Block / Unblock</th>
              </tr>
              </thead>
              <tbody id="usersBody"></tbody>
          </table>
      </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="js/common.js"></script>
<script>
  function loadUsers() {
    $.get("/api/admin/users").done(function (users) {
      const $body = $("#usersBody").empty();
      users.forEach(function (u, index) {
        $body.append(`
          <tr>
            <td>${index + 1}</td>
            <td>${u.email}</td>
            <td><span class="role-tag" style="--role-color:${u.user_type === 'INFLUENCER' ? 'var(--influencer)' : 'var(--brand)'}">${u.user_type}</span></td>
            <td>${u.status === 1 ? '<span class="badge-status-active">Active</span>' : '<span class="badge-status-blocked">Blocked</span>'}</td>
            <td><button class="btn btn-outline-role btn-sm" data-action="delete" data-email="${u.email}">Delete</button></td>
            <td>
              <button class="btn btn-danger btn-sm" data-action="block" data-email="${u.email}">Block</button>
              <button class="btn btn-success btn-sm" data-action="unblock" data-email="${u.email}">Unblock</button>
            </td>
          </tr>
        `);
      });
    });
  }

  $(document).ready(function () {
    loadUsers();

    $("#usersBody").on("click", "button[data-action]", function () {
      const email = $(this).data("email");
      const action = $(this).data("action");

      let request;
      if (action === "delete") {
        request = $.ajax({ type: "DELETE", url: "/api/admin/users/" + encodeURIComponent(email) });
      } else {
        request = $.ajax({
          type: "PATCH",
          url: "/api/admin/users/" + encodeURIComponent(email) + "/status",
          contentType: "application/json",
          data: JSON.stringify({ status: action === "unblock" ? 1 : 0 }),
        });
      }

      request.done(function (resp) {
        showAlert("#usersAlert", resp.message, "success");
        loadUsers();
      }).fail(function (xhr) {
        showAlert("#usersAlert", xhr.responseJSON ? xhr.responseJSON.message : "Action failed.", "danger");
      });
    });
  });
</script>
</body>

</html>
