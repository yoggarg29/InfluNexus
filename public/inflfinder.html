<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Influencer — InfluNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="role-brand">
  <div class="role-strip"></div>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/branddash">
        <img src="pics/logo3.jpg" alt="InfluNexus logo" width="42" height="42" style="object-fit:cover;">
        <span class="navbar-brand-text">InfluNexus</span>
      </a>
    </div>
  </nav>

    <div class="container">
      <div class="pt-5 pb-4">
        <div class="role-tag mb-2">Brand space</div>
        <h1 class="mb-1">Search Influencer</h1>
        <p class="lede">Filter by niche, city, or name — leave any field blank to widen the search.</p>
      </div>

      <div class="card mb-5">
        <div class="card-body p-4">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="contype" class="form-label">Content Type</label>
                <select id="contype" class="form-select">
                    <option value="">Any content type</option>
                  <option value="Fashion">Fashion</option>
                  <option value="Fitness">Fitness</option>
                  <option value="Health and Wellness">Health and Wellness</option>
                  <option value="Food & Nutrition">Food & Nutrition</option>
                  <option value="Travel">Travel</option>
                  <option value="Business & Finance">Business & Finance</option>
                  <option value="Family">Family</option>
                  <option value="Sports">Sports</option>
                  <option value="Gaming">Gaming</option>
                  <option value="Animal">Animal</option>
                  <option value="Beauty">Beauty</option>
                  <option value="Technology">Technology</option>
                  <option value="Coding">Coding</option>
                  <option value="Education">Education</option>
                  <option value="Photography">Photography</option>
                  <option value="Others">Others</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="city" class="form-label">City</label>
                <select id="city" class="form-select">
                    <option value="">Any city</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="pname" class="form-label">Name</label>
               <input type="text" class="form-control" id="pname" placeholder="Search by name">
            </div>
            <div class="col-md-2">
               <button type="button" id="btnfind" class="btn btn-primary w-100">Find Now</button>
            </div>
          </div>
        </div>
      </div>

      <div id="resultsMeta" class="eyebrow mb-3"></div>
      <div class="row g-4 pb-5" id="resultsRow"></div>
    </div>

<div class="modal fade" id="infomodal" tabindex="-1" aria-labelledby="infomodalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="role-tag mb-1">Influencer</div>
          <h1 class="modal-title fs-5" id="infomodalLabel">Profile Details</h1>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="infomodalBody">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="js/common.js"></script>
<script>
  let currentResults = [];

  function loadCities() {
    $.get("/api/influencer/cities").done(function (rows) {
      const $city = $("#city");
      rows.forEach(function (row) {
        $city.append(`<option value="${row.city}">${row.city}</option>`);
      });
    });
  }

  function renderResults(rows) {
    currentResults = rows;
    $("#resultsMeta").text(rows.length + (rows.length === 1 ? " influencer found" : " influencers found"));
    const $row = $("#resultsRow").empty();
    if (rows.length === 0) {
      $row.append(`
        <div class="col-12">
          <div class="empty-state">
            <i class="fa-solid fa-magnifying-glass fs-2 mb-2 d-block"></i>
            No influencers matched your search. Try widening your filters.
          </div>
        </div>
      `);
      return;
    }
    rows.forEach(function (p, index) {
      $row.append(`
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body text-center p-4">
              <img src="uploads/${p.profile_picture}" class="avatar-ring mb-3" height="84" width="84" alt="${p.full_name}">
              <h5 class="card-title mb-1">${p.full_name}</h5>
              <p class="eyebrow mb-2">${p.city}</p>
              <p class="card-text mb-3">${p.content_type}</p>
              <button class="btn btn-outline-role btn-sm" data-bs-toggle="modal" data-bs-target="#infomodal" data-index="${index}">More Info</button>
            </div>
          </div>
        </div>
      `);
    });
  }

  $(document).ready(function () {
    loadCities();

    $("#btnfind").click(function () {
      const params = {};
      const contentType = $("#contype").val();
      const city = $("#city").val();
      const name = $("#pname").val();
      if (contentType) params.contentType = contentType;
      if (city) params.city = city;
      if (name) params.name = name;

      $.get("/api/influencer/search", params).done(renderResults);
    });

    $("#resultsRow").on("click", "button[data-index]", function () {
      const p = currentResults[$(this).data("index")];
      $("#infomodalBody").html(`
        <div class="text-center mb-3">
          <img src="uploads/${p.profile_picture}" class="avatar-ring" height="90" width="90" alt="${p.full_name}">
          <h5 class="mt-2 mb-0">${p.full_name}</h5>
        </div>
        <p class="mb-2"><strong>Email:</strong> ${p.email}</p>
        <p class="mb-2"><strong>Phone:</strong> ${p.phone}</p>
        <p class="mb-2"><strong>City:</strong> ${p.city}, ${p.state}</p>
        <p class="mb-2"><strong>Content Type:</strong> ${p.content_type}</p>
        <p class="mb-2"><strong>Instagram:</strong> ${p.instagram_handle || "-"}</p>
        <p class="mb-2"><strong>Youtube:</strong> ${p.youtube_channel || "-"}</p>
        <p class="mb-2"><strong>Twitter:</strong> ${p.twitter_handle || "-"}</p>
        <p class="mb-0"><strong>Other Details:</strong> ${p.other_details || "-"}</p>
      `);
    });
  });
</script>
</body>
</html>
