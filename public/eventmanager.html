<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Manager — InfluNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="role-influencer">
  <div class="role-strip"></div>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/infldash">
        <img src="pics/logo3.jpg" alt="InfluNexus logo" width="42" height="42" style="object-fit:cover;">
        <span class="navbar-brand-text">InfluNexus</span>
      </a>
    </div>
  </nav>

    <div class="container">
      <div class="pt-5 pb-4">
        <div class="role-tag mb-2">Influencer space</div>
        <h1 class="mb-1">Events Manager</h1>
        <p class="lede">Everything you've posted for brands to discover.</p>
      </div>

      <div id="eventsAlert"></div>
      <div id="eventsList" class="row g-3 pb-5"></div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="js/common.js"></script>
<script>
  function loadEvents() {
    $.get("/api/influencer/events").done(function (events) {
      const $list = $("#eventsList").empty();
      if (events.length === 0) {
        $list.append(`
          <div class="col-12">
            <div class="empty-state">
              <i class="fa-regular fa-calendar fs-2 mb-2 d-block"></i>
              No events posted yet — head back to your dashboard to post one.
            </div>
          </div>
        `);
        return;
      }
      events.forEach(function (ev) {
        $list.append(`
          <div class="col-md-6 col-lg-4">
            <div class="card tile h-100">
              <div class="card-body p-4">
                <h5 class="card-title mb-2">${ev.title}</h5>
                <p class="card-text mb-1"><i class="fa-regular fa-calendar me-2"></i>${ev.event_date} &middot; ${ev.start_time}</p>
                <p class="card-text mb-3"><i class="fa-solid fa-location-dot me-2"></i>${ev.place} — ${ev.location}</p>
                <button class="btn btn-outline-role btn-sm" data-id="${ev.event_id}">Delete</button>
              </div>
            </div>
          </div>
        `);
      });
    });
  }

  $(document).ready(function () {
    loadEvents();

    $("#eventsList").on("click", "button[data-id]", function () {
      const eventId = $(this).data("id");
      $.ajax({ type: "DELETE", url: "/api/influencer/events/" + eventId })
        .done(function (resp) {
          showAlert("#eventsAlert", resp.message, "success");
          loadEvents();
        })
        .fail(function (xhr) {
          showAlert("#eventsAlert", xhr.responseJSON ? xhr.responseJSON.message : "Could not delete event.", "danger");
        });
    });
  });
</script>
</body>

</html>
